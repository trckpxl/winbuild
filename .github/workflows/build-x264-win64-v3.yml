name: Build x264 Base Windows x86-64-v3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build-basic-lavf-lsmash:
    runs-on: ubuntu-latest
    steps:
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make cmake nasm mingw-w64 pkg-config ca-certificates xz-utils

      - name: Build static libobuparse for mingw-w64 x86-64-v3
        run: |
          DEPS_DIR="$PWD/deps-win64-v3"
          mkdir -p "$DEPS_DIR"
          git clone --depth=1 https://github.com/dwbuiten/obuparse.git obuparse-src
          cd obuparse-src
          cmake -B build-win64-v3 \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX="$DEPS_DIR" \
            -DCMAKE_C_FLAGS="-march=x86-64-v3 -O3" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build-win64-v3 -j"$(nproc)"
          cmake --install build-win64-v3

      - name: Build static L-SMASH for mingw-w64 x86-64-v3
        run: |
          DEPS_DIR="$PWD/deps-win64-v3"
          git clone --depth=1 https://github.com/vimeo/l-smash.git lsmash-src
          cd lsmash-src
          ./configure \
            --prefix="$DEPS_DIR" \
            --target-os=mingw \
            --cross-prefix=x86_64-w64-mingw32- \
            --extra-cflags="-I${DEPS_DIR}/include -march=x86-64-v3 -O3" \
            --extra-ldflags="-L${DEPS_DIR}/lib"
          make -j"$(nproc)"
          make install

      - name: Build static FFmpeg (lavf) for mingw-w64 x86-64-v3
        run: |
          DEPS_DIR="$PWD/deps-win64-v3"
          git clone --depth=1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --prefix="$DEPS_DIR" \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --enable-cross-compile \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-swresample \
            --disable-avfilter \
            --disable-network \
            --extra-cflags="-march=x86-64-v3 -O3"
          make -j"$(nproc)"
          make install

      - name: Clone x264 at commit c1c9931
        run: |
          git clone https://code.videolan.org/videolan/x264.git
          cd x264
          git checkout c1c9931

      - name: Configure and build x264 with lavf and l-smash for Windows x86-64-v3
        run: |
          DEPS_DIR="$PWD/deps-win64-v3"
          export PKG_CONFIG_LIBDIR="$DEPS_DIR/lib/pkgconfig"
          cd x264
          ./configure \
            --host=x86_64-w64-mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --enable-static \
            --enable-strip \
            --prefix="$PWD/out-win64-v3" \
            --extra-cflags="-I${DEPS_DIR}/include -march=x86-64-v3 -O3" \
            --extra-ldflags="-L${DEPS_DIR}/lib -static"
          make -j"$(nproc)"
          make install

      - name: Upload basic artifact
        uses: actions/upload-artifact@v4
        with:
          name: x264-r3172-c1c9931-lavf-lsmash-win64-v3
          path: x264/out-win64-v3/
